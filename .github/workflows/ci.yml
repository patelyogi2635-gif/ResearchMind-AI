name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Also run the research eval (uses API quota)"
        type: boolean
        default: false
      eval_limit:
        description: "Number of golden topics to evaluate"
        default: "8"

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      GROQ_API_KEY: test-groq
      TAVILY_API_KEY: test-tavily
      GITHUB_TOKEN: test-github
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      MONGODB_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    needs: tests
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      MONGODB_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run research eval
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
        run: python -m evals.research_eval --limit ${{ inputs.eval_limit }} --out evals/reports/ci_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-eval-report
          path: backend/evals/reports/ci_report.json